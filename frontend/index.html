<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZeroLifestyle AI Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2>🛒 Shop AI</h2>

            </div>

            <button
                id="clear-chat"
                class="clear-btn"
            >
                New Chat
            </button>

            <div class="sidebar-footer">

                <p>Powered by</p>

                <span>Hafiz Rayyan</span>

            </div>

        </aside>

        <!-- Chat Area -->

        <main class="chat-container">

            <header class="chat-header">

                <h1>AI Assistant</h1>

                <p>
                    Ask about products,
                    shipping,
                    returns,
                    warranty,
                    orders and more.
                </p>

            </header>

            <div
                id="chat-box"
                class="chat-box"
            >

                <!-- Welcome Message -->

                <div class="message bot">

                    <div class="avatar">

                        AI

                    </div>

                    <div class="bubble">

                        Hello 👋

                        <br><br>

                        I can answer questions about:

                        <ul>

                            <li>Products</li>

                            <li>Shipping</li>

                            <li>Refunds</li>

                            <li>Returns</li>

                            <li>Payment</li>

                            <li>Store Policies</li>

                        </ul>

                    </div>

                </div>

            </div>

            <div
                id="typing"
                class="typing"
            >

                <span></span>
                <span></span>
                <span></span>

                AI is typing...

            </div>

            <div class="input-area">

                <textarea

                    id="question"

                    rows="1"

                    placeholder="Ask anything about the store..."

                ></textarea>

                <button
                    id="send"
                >

                    Send

                </button>

            </div>

        </main>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
